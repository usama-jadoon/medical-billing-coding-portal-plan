version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: medical_coding_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: medical_coding
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: medical_coding_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: medical_coding_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    container_name: medical_coding_api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@postgres:5432/medical_coding
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_PROVIDER=local
      - LOCAL_STORAGE_PATH=/app/local_storage
      - QUEUE_BACKEND=outbox
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET=medical-documents
      - APP_ENV=development
      - SECRET_KEY=docker-compose-secret-key-change-in-production
    ports:
      - "8000:8000"
    volumes:
      - document_data:/app/local_storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ready"]
      interval: 5s
      timeout: 5s
      retries: 12

  worker:
    build:
      context: .
      dockerfile: infra/docker/worker.Dockerfile
    container_name: medical_coding_worker
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@postgres:5432/medical_coding
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_PROVIDER=local
      - LOCAL_STORAGE_PATH=/app/local_storage
      - QUEUE_BACKEND=outbox
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET=medical-documents
      - APP_ENV=development
    volumes:
      - document_data:/app/local_storage

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    container_name: medical_coding_web
    depends_on:
      - api
    environment:
      - API_INTERNAL_URL=http://api:8000
    ports:
      - "3000:3000"

volumes:
  document_data:
  postgres_data:
  redis_data:
  minio_data:
